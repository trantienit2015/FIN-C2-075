[project]
name = "fin-c2-075"
version = "0.1.0"
description = "Financial Accounts Payable Intelligent Processing & Approval Agent — AgentCore Template"
requires-python = ">=3.11"
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3","pyyaml==6.0.1"]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# The agenticstar-agentcore wheel ships no py.typed marker, so mypy resolves
# AgentBaseGraph / FunctionNode / BaseNode to Any and strict mode then reports
# "cannot subclass Any" for exactly the inheritance the framework requires.
# Stating that once here beats scattering `# type: ignore[misc]` over every node.
# Remove this line and re-measure once the wheel ships py.typed.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# Declares "this dependency has no type information" — deliberately NOT
# disable_error_code, which would switch off checking of our own code. Drop this
# whole section and re-measure once the wheel ships py.typed.
module = ["framework.*", "shared.*", "langgraph.*", "langchain_core.*"]
ignore_missing_imports = true
