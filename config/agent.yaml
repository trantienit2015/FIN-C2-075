# Agent Manifest — AgentRegistry entry point
# AgentRegistry (mediator/registry/agent_registry.py) reads every key below at
# ROOT level — do NOT nest keys under an `agent:` block. That nested shape is
# invisible to the registry (falls back to defaults / KeyErrors).
id: "FIN-C2-075"
name: "fin_c2_075_ap_approval_agent"
namespace: "fin"
version: "0.2.0"
enabled: true
category: "Cat 2"
# Static generation contract — this template is fully deterministic (rule-based
# 3-way match, amount-tier routing, regex QII validation). No LLM call anywhere.
generation_mode: "deterministic"
industry: "FIN"

# Opaque compatibility metadata. It is not an inheritance selector or gate input.
base_type: "DocGenerationAgent"

# Entry point — single dotted import path (module.Class), NOT split module:/class:.
# AgentRegistry does `manifest["class"].rsplit(".", 1)` to get (module, class_name).
class: "src.graph.graph.AccountsPayableApprovalGraph"

# Security
required_trust_level: "VERIFIED_EXTERNAL"

# Compile-time gates (AgentRegistry._compile_and_cache). requires.secrets is
# enforced by require_at_compile(), which fails closed (entry -> failed -> HTTP 503)
# for every key listed but unavailable. This template calls ctx.secrets.require()
# nowhere: the OCR / ERP / bank clients are constructor-injected by the deployment
# (see src/nodes/*_node.py), so listing credential keys here would hard-fail the
# compile for secrets the agent never reads. Declared empty, deliberately.
requires:
  secrets: []
  extras: []

# Runtime parameters (max_retry, timeout_s, hitl, memory_enabled, approval tiers, ...)
# live in config/config.yaml — AgentRegistry loads that file separately and passes it
# as Graph(config=...). Do NOT put them here.
